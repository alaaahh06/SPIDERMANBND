<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man: Brand New Day</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none; /* Prevents pull-to-refresh and bounce */
            background-color: #1a1a2e;
            color: white;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            background-color: #0f0f1a;
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Keeps pixel art sharp */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #ff3b3b;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            margin-bottom: 10px;
            text-align: center;
            font-size: 32px;
            text-transform: uppercase;
        }

        p {
            max-width: 80%;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .highlight {
            color: #4da6ff;
            font-weight: bold;
        }

        .controls {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px dashed #777;
        }

        button {
            pointer-events: auto;
            background-color: #e62e2e;
            color: white;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #ff4d4d;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        #score-display {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 #000;
            z-index: 5;
        }
        
        #mobile-controls {
            display: block;
            pointer-events: none;
        }
        
        .d-pad {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            pointer-events: auto;
            z-index: 100;
            touch-action: none;
        }

        .action-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            pointer-events: auto;
            z-index: 100;
            touch-action: none;
        }
        
        .m-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
            touch-action: none;
        }

        .m-btn:active {
            background: rgba(255, 255, 255, 0.6);
        }

        #portrait-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a2e;
            color: #ff3b3b;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 20px;
            box-sizing: border-box;
            text-transform: uppercase;
        }

        #portrait-warning svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            color: white;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }
        
        @media (max-width: 850px) {
            #game-container { 
                width: 100vw; 
                height: 100vh; 
                border: none; 
                border-radius: 0; 
            }
            canvas {
                object-fit: contain; /* Keeps pixel aspect ratio correct without stretching */
            }
            .d-pad {
                bottom: 15px;
                left: 15px;
            }
            .action-buttons {
                bottom: 15px;
                right: 15px;
            }
            .m-btn {
                width: 50px;
                height: 50px;
                font-size: 16px;
            }
        }

        /* Enforce Landscape Mode */
        @media (orientation: portrait) {
            #portrait-warning {
                display: flex;
            }
            #game-container {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div id="portrait-warning">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
        <p>Please rotate your device to<br>landscape mode to play</p>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div id="score-display">Score: <span id="scoreVal">0</span></div>

        <div id="ui-layer">
            <h1 id="screen-title">Brand New Day</h1>
            <p id="story-text">
                Peter is back to basics and completely broke. <br>
                Mister Negative's Inner Demons are roaming the streets.<br>
                <span class="highlight">Time to go to work.</span>
            </p>
            <div class="controls" id="controls-text">
                [ ARROWS ] Move &nbsp;|&nbsp; [ SPACE ] Jump &nbsp;|&nbsp; [ Z ] Shoot Web
            </div>
            <button id="start-btn">Start Game</button>
        </div>

        <div id="mobile-controls">
            <div class="d-pad">
                <div class="m-btn" id="btn-left">◀</div>
                <div class="m-btn" id="btn-right">▶</div>
            </div>
            <div class="action-buttons">
                <div class="m-btn" id="btn-jump">▲</div>
                <div class="m-btn" id="btn-shoot">Z</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiLayer = document.getElementById('ui-layer');
        const startBtn = document.getElementById('start-btn');
        const scoreVal = document.getElementById('scoreVal');
        const screenTitle = document.getElementById('screen-title');
        const storyText = document.getElementById('story-text');

        // Game Constants & State
        const GRAVITY = 0.6;
        const GROUND_Y = 320;
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let lastTime = 0;
        let animationFrameId;

        // Input handling
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            Space: false,
            z: false
        };
        
        // Touch states for mobile
        const touchInput = {
            left: false,
            right: false,
            jump: false,
            shoot: false
        };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
            if (e.key === 'z' || e.key === 'Z') keys.z = true;
            if (e.code === 'Space') keys.Space = true;
            
            // Prevent scrolling with space/arrows
            if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
            if (e.key === 'z' || e.key === 'Z') keys.z = false;
            if (e.code === 'Space') keys.Space = false;
        });

        const setupTouch = (id, action) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); touchInput[action] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); touchInput[action] = false; });
        };
        setupTouch('btn-left', 'left');
        setupTouch('btn-right', 'right');
        setupTouch('btn-jump', 'jump');
        setupTouch('btn-shoot', 'shoot');


        class Player {
            constructor() {
                this.width = 32;
                this.height = 32;
                this.x = 100;
                this.y = GROUND_Y - this.height;
                this.vx = 0;
                this.vy = 0;
                this.speed = 5;
                this.jumpStrength = -12;
                this.grounded = false;
                this.facingRight = true;
                this.shootCooldown = 0;
                this.pixelScale = 4; // 8x8 logical pixels scaled by 4 = 32x32
            }

            update() {
                // Horizontal movement
                if (keys.ArrowLeft || touchInput.left) {
                    this.vx = -this.speed;
                    this.facingRight = false;
                } else if (keys.ArrowRight || touchInput.right) {
                    this.vx = this.speed;
                    this.facingRight = true;
                } else {
                    this.vx = 0; // stop instantly
                }

                this.x += this.vx;

                // Screen bounds
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

                // Vertical movement / Gravity
                this.vy += GRAVITY;
                this.y += this.vy;

                // Ground collision
                if (this.y + this.height >= GROUND_Y) {
                    this.y = GROUND_Y - this.height;
                    this.vy = 0;
                    this.grounded = true;
                } else {
                    this.grounded = false;
                }

                // Jumping
                if ((keys.Space || touchInput.jump) && this.grounded) {
                    this.vy = this.jumpStrength;
                    this.grounded = false;
                }

                // Shooting
                if (this.shootCooldown > 0) this.shootCooldown--;
                if ((keys.z || touchInput.shoot) && this.shootCooldown === 0) {
                    this.shootWeb();
                    this.shootCooldown = 20; // frames between shots
                }
            }

            shootWeb() {
                webs.push(new Web(
                    this.facingRight ? this.x + this.width : this.x,
                    this.y + 12,
                    this.facingRight ? 1 : -1
                ));
            }

            draw(ctx) {
                const s = this.pixelScale;
                const px = this.x;
                const py = this.y;

                // Simple 8x8 pixel art Spidey mapping
                ctx.fillStyle = '#ff0000'; // Red base
                ctx.fillRect(px, py, this.width, this.height);
                
                // Blue side sections (torso)
                ctx.fillStyle = '#0000ff';
                ctx.fillRect(px, py + 3*s, 2*s, 3*s); // left flank
                ctx.fillRect(px + 6*s, py + 3*s, 2*s, 3*s); // right flank
                
                // Blue leg sections
                ctx.fillRect(px, py + 5*s, 2*s, 2*s);
                ctx.fillRect(px + 6*s, py + 5*s, 2*s, 2*s);
                
                // Eyes (White)
                ctx.fillStyle = '#ffffff';
                if (this.facingRight) {
                    ctx.fillRect(px + 5*s, py + 1*s, 2*s, 1.5*s);
                    ctx.fillRect(px + 2*s, py + 1*s, 2*s, 1.5*s);
                } else {
                    ctx.fillRect(px + 1*s, py + 1*s, 2*s, 1.5*s);
                    ctx.fillRect(px + 4*s, py + 1*s, 2*s, 1.5*s);
                }
                
                // Web shooters / hands
                ctx.fillStyle = '#ff0000';
                if (this.shootCooldown > 15) { // Animation frame for shooting
                    if (this.facingRight) ctx.fillRect(px + 7*s, py + 3*s, 2*s, 1*s);
                    else ctx.fillRect(px - 1*s, py + 3*s, 2*s, 1*s);
                }
            }
        }

        class Web {
            constructor(x, y, direction) {
                this.x = x;
                this.y = y;
                this.width = 12;
                this.height = 4;
                this.speed = 10 * direction;
                this.active = true;
            }

            update() {
                this.x += this.speed;
                if (this.x > canvas.width || this.x < 0) {
                    this.active = false;
                }
            }

            draw(ctx) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        class Enemy {
            constructor(x, speed) {
                this.width = 32;
                this.height = 32;
                this.x = x;
                this.y = GROUND_Y - this.height;
                this.speed = speed;
                this.active = true;
                this.pixelScale = 4;
                this.scared = false;
            }

            update() {
                if (this.scared) {
                    // Run away from screen center when scared
                    if (this.x > canvas.width / 2) {
                        this.x += Math.abs(this.speed) * 1.5;
                    } else {
                        this.x -= Math.abs(this.speed) * 1.5;
                    }
                    // Deactivate if far off screen
                    if (this.x < -100 || this.x > canvas.width + 100) {
                        this.active = false;
                    }
                } else {
                    // Always move towards player (simple AI)
                    if (player.x < this.x) {
                        this.x -= this.speed;
                    } else {
                        this.x += this.speed;
                    }
                }
            }

            draw(ctx) {
                const s = this.pixelScale;
                const px = this.x;
                const py = this.y;

                if (this.scared) {
                    // Scared yellow state
                    ctx.fillStyle = '#eab308'; // Yellow
                    ctx.fillRect(px, py, this.width, this.height);
                    
                    // Scared face (black)
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(px + 2*s, py + 1*s, 1*s, 1.5*s); // left eye wide
                    ctx.fillRect(px + 5*s, py + 1*s, 1*s, 1.5*s); // right eye wide
                    ctx.fillRect(px + 3*s, py + 4*s, 2*s, 2*s); // open mouth
                } else {
                    // Mister Negative Thugs: High contrast black and white
                    ctx.fillStyle = '#ffffff'; // White suit
                    ctx.fillRect(px, py, this.width, this.height);

                    ctx.fillStyle = '#000000'; // Black tie/shirt and face
                    // Face
                    ctx.fillRect(px + 2*s, py, 4*s, 2*s);
                    // Suit details (Tie)
                    ctx.fillRect(px + 3.5*s, py + 2*s, 1*s, 4*s);
                    // Legs
                    ctx.fillRect(px + 1*s, py + 6*s, 2*s, 2*s);
                    ctx.fillRect(px + 5*s, py + 6*s, 2*s, 2*s);
                    
                    // Negative Eyes (white on black face)
                    ctx.fillStyle = '#ffffff';
                    let facingRight = player.x > this.x;
                    if (facingRight) {
                        ctx.fillRect(px + 4*s, py + 0.5*s, 1*s, 1*s);
                    } else {
                        ctx.fillRect(px + 3*s, py + 0.5*s, 1*s, 1*s);
                    }
                }
            }
        }

        class Hulk {
            constructor(x, speed) {
                this.width = 32;
                this.height = 32;
                this.x = x;
                this.y = GROUND_Y - this.height;
                this.speed = speed * 0.5; // Hulk moves slower
                this.active = true;
                this.hp = 8;
                this.maxHp = 8;
            }

            update() {
                if (player.x < this.x) {
                    this.x -= this.speed;
                } else {
                    this.x += this.speed;
                }
            }

            draw(ctx) {
                // Big green pixelated square
                ctx.fillStyle = '#22c55e'; // Strong Green
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Health bar background (red)
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(this.x, this.y - 12, this.width, 5);
                
                // Health bar foreground (green)
                const healthPercent = this.hp / this.maxHp;
                ctx.fillStyle = '#4ade80';
                ctx.fillRect(this.x, this.y - 12, this.width * healthPercent, 5);
                
                // Simple angry face
                ctx.fillStyle = '#000000';
                let facingRight = player.x > this.x;
                if (facingRight) {
                    ctx.fillRect(this.x + 18, this.y + 6, 4, 4); // Eye
                    ctx.fillRect(this.x + 16, this.y + 20, 12, 4); // Mouth
                } else {
                    ctx.fillRect(this.x + 10, this.y + 6, 4, 4); // Eye
                    ctx.fillRect(this.x + 4, this.y + 20, 12, 4); // Mouth
                }
            }
        }

        function drawBackground(ctx) {
            // Night Sky
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Simple Stars
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(50, 50, 2, 2);
            ctx.fillRect(200, 150, 1, 1);
            ctx.fillRect(450, 80, 2, 2);
            ctx.fillRect(700, 120, 1, 1);
            ctx.fillRect(600, 30, 2, 2);

            // Distant City Skyline
            ctx.fillStyle = '#111122';
            ctx.fillRect(0, GROUND_Y - 100, 100, 100);
            ctx.fillRect(120, GROUND_Y - 150, 80, 150);
            ctx.fillRect(220, GROUND_Y - 80, 120, 80);
            ctx.fillRect(380, GROUND_Y - 180, 90, 180);
            ctx.fillRect(500, GROUND_Y - 120, 110, 120);
            ctx.fillRect(650, GROUND_Y - 90, 150, 90);

            // Ground/Street
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
            
            // Street line detail
            ctx.fillStyle = '#34495e';
            ctx.fillRect(0, GROUND_Y + 10, canvas.width, 4);
        }

        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        let player;
        let webs = [];
        let enemies = [];
        let hulks = [];
        let enemySpawnTimer = 0;

        function resetGame() {
            player = new Player();
            webs = [];
            enemies = [];
            hulks = [];
            score = 0;
            scoreVal.innerText = score;
            gameState = 'PLAYING';
            uiLayer.classList.add('hidden');
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            screenTitle.innerText = 'Defeated';
            storyText.innerHTML = `Mister Negative's forces overwhelmed you.<br>Final Score: <span class="highlight">${score}</span>`;
            startBtn.innerText = 'Try Again';
            uiLayer.classList.remove('hidden');
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            player.update();

            // Update Webs
            webs.forEach(web => web.update());
            webs = webs.filter(web => web.active);

            // Check if Hulk is currently on screen
            let hulkPresent = hulks.length > 0;

            if (hulkPresent) {
                // Scare all current enemies
                enemies.forEach(enemy => enemy.scared = true);
            }

            // Spawn Enemies
            enemySpawnTimer++;
            if (enemySpawnTimer > Math.max(40, 120 - score * 2)) { // Speeds up as score increases
                let spawnX = Math.random() > 0.5 ? canvas.width + 30 : -30;
                let speed = 1.5 + Math.random() + (score * 0.05); // Progressively faster
                
                if (hulkPresent) {
                    // Do nothing, pause spawning while Hulk is alive
                } else {
                    // 15% chance to spawn a Hulk Boss once you have a bit of a score
                    if (score > 50 && Math.random() < 0.15) {
                        hulks.push(new Hulk(spawnX, speed));
                    } else {
                        enemies.push(new Enemy(spawnX, speed));
                    }
                }
                enemySpawnTimer = 0;
            }

            // Update Enemies & Check Collisions
            enemies.forEach(enemy => {
                enemy.update();

                // Player collision with enemy
                if (checkCollision(player, enemy)) {
                    gameOver();
                }

                // Web collision with enemy
                webs.forEach(web => {
                    if (web.active && checkCollision(web, enemy)) {
                        web.active = false;
                        enemy.active = false;
                        score += 10;
                        scoreVal.innerText = score;
                    }
                });
            });

            enemies = enemies.filter(enemy => enemy.active);

            // Update Hulks & Check Collisions
            hulks.forEach(hulk => {
                hulk.update();

                // Player collision with Hulk
                if (checkCollision(player, hulk)) {
                    gameOver();
                }

                // Web collision with Hulk
                webs.forEach(web => {
                    if (web.active && checkCollision(web, hulk)) {
                        web.active = false; // Destroy the web
                        hulk.hp -= 1; // Damage Hulk by 1
                        
                        if (hulk.hp <= 0) {
                            hulk.active = false;
                            score += 50; // Boss defeat bonus
                            scoreVal.innerText = score;
                        }
                    }
                });
            });

            hulks = hulks.filter(hulk => hulk.active);
        }

        function draw() {
            drawBackground(ctx);

            if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                player.draw(ctx);
                webs.forEach(web => web.draw(ctx));
                enemies.forEach(enemy => enemy.draw(ctx));
                hulks.forEach(hulk => hulk.draw(ctx));
            }
        }

        function gameLoop(timestamp) {
            // Optional delta time calculation can go here
            update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', () => {
            resetGame();
        });

        // Start the loop (rendering only background initially)
        drawBackground(ctx);
        gameLoop();

    </script>
</body>
</html>
