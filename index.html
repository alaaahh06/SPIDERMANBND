<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campus Wallet – Student Expense Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&family=Space+Mono:wght@400;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem("campus-wallet-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2320;--mute:#6b746e;--line:#e3e7e2;--acc:#1f7a5a;--accbg:#e2f3ec;--bad:#c2452d;--badbg:#fbe9e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121513;--card:#1b201d;--ink:#eef2ee;--mute:#95a099;--line:#2b322d;--acc:#4cc59a;--accbg:#183a2d;--bad:#f0745c;--badbg:#3b1f19}}
:root[data-theme="dark"]{--bg:#121513;--card:#1b201d;--ink:#eef2ee;--mute:#95a099;--line:#2b322d;--acc:#4cc59a;--accbg:#183a2d;--bad:#f0745c;--badbg:#3b1f19}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--mute);font-weight:600}
.seg button.on{background:var(--acc);color:#fff}
.btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
.big{font-size:28px;font-weight:700}
.mute{color:var(--mute);font-size:13px}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .m{flex:1;min-width:0}.tx .m b{display:block;font-weight:600}
.tx .m span{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.amt.e{color:var(--bad)}.amt.i{color:var(--acc)}
.x{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc)}
.cat{margin:10px 0}.cat div{display:flex;justify-content:space-between;font-size:14px}
.cols{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mute)}
.cols i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.sum{display:flex;gap:8px;margin-top:10px}.sum>div{flex:1;background:var(--bg);border-radius:10px;padding:8px}
.sum small{display:block;color:var(--mute);font-size:11px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.foot div{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.foot b{font-size:22px}
.empty{color:var(--mute);text-align:center;padding:14px 0;font-size:14px}
summary{cursor:pointer;font-weight:600}
:root{--bg:#e9e9e7;--card:#f8f8f6;--ink:#0b0b0b;--mute:#7a7a77;--line:#cfcfcb;--acc:#d71921;--accbg:#f3d6d7;--bad:#d71921;--badbg:#f3d6d7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#0d0d0d;--ink:#fff;--mute:#8a8a8a;--line:#2a2a2a;--acc:#d71921;--accbg:#2a0c0e;--bad:#ff3b3b;--badbg:#2a0c0e}}
:root[data-theme="dark"]{--bg:#000;--card:#0d0d0d;--ink:#fff;--mute:#8a8a8a;--line:#2a2a2a;--acc:#d71921;--accbg:#2a0c0e;--bad:#ff3b3b;--badbg:#2a0c0e}
body{font-family:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background-image:radial-gradient(var(--line) 1px,transparent 1.3px);background-size:18px 18px}
h1{font-family:"Doto",ui-monospace,monospace;font-weight:900;font-size:44px;line-height:.95;letter-spacing:1px;margin:10px 0 20px;display:flex;align-items:flex-start;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--acc);margin-top:6px;flex:none}
.card{border-radius:28px;padding:18px;background:var(--card);border:1px solid var(--line)}
label{text-transform:uppercase;letter-spacing:1.5px;font-size:10px}
input,select{border-radius:14px;background:transparent;border:1px solid var(--line);font-family:inherit;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.seg{border-radius:999px;background:transparent;padding:4px}
.seg button{border-radius:999px;font-family:inherit;text-transform:uppercase;letter-spacing:1.5px;font-size:11px}
.seg button.on{background:var(--ink);color:var(--bg)}
.btn{border-radius:999px;background:var(--ink);color:var(--bg);font-family:inherit;text-transform:uppercase;letter-spacing:2px;font-size:12px}
.big,.foot b,.sum b{font-family:"Doto",ui-monospace,monospace;font-weight:800}
.foot b{font-size:34px;letter-spacing:1px}
.sum>div{border:1px solid var(--line);background:transparent;border-radius:18px}
.sum small{text-transform:uppercase;letter-spacing:1px;font-size:9px}
.sum b{font-size:20px}
.amt.i{color:var(--ink)}
.amt.e{color:var(--acc)}
.bar{background:transparent;height:8px}
.bar i{background:repeating-linear-gradient(to right,var(--ink) 0 4px,transparent 4px 7px);border-radius:0}
.cols i{background:repeating-linear-gradient(to top,var(--acc) 0 4px,transparent 4px 7px);border-radius:0}
.foot{background:var(--card);border-top:1px solid var(--line)}
.foot .mute{text-transform:uppercase;letter-spacing:1.5px;font-size:10px}
.x{font-family:inherit}
h3{text-transform:uppercase;letter-spacing:1.5px;font-size:11px!important;color:var(--mute)}
summary{text-transform:uppercase;letter-spacing:1.5px;font-size:12px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes flash{from{background:var(--accbg)}to{background:transparent}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
main>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:.07s}main>*:nth-child(3){animation-delay:.14s}main>*:nth-child(4){animation-delay:.21s}main>*:nth-child(5){animation-delay:.28s}
#view>*{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
#view>*:nth-child(2){animation-delay:.04s}#view>*:nth-child(3){animation-delay:.08s}#view>*:nth-child(4){animation-delay:.12s}#view>*:nth-child(n+5){animation-delay:.16s}
.tx.new{animation:rise .4s both,flash 1.6s ease-out;border-radius:10px}
.dot{animation:blink 2.4s ease-in-out infinite}
.bar i{transform-origin:left;animation:growx .8s cubic-bezier(.2,.7,.2,1) both}
.cols i{transform-origin:bottom;animation:growy .8s cubic-bezier(.2,.7,.2,1) both}
.btn,.seg button,.x,input,select,.sum>div{transition:transform .15s,background .25s,color .25s,border-color .25s}
.btn:active,.seg button:active,.x:active{transform:scale(.94)}
.sum>div:hover{transform:translateY(-2px);border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---- theme toggle ---- */
main{position:relative}
#themeBtn{position:absolute;top:16px;right:16px;z-index:5;display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-family:inherit;text-transform:uppercase;letter-spacing:1.5px;font-size:10px;cursor:pointer;animation:none}
#themeBtn:hover{border-color:var(--ink)}
#themeBtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#themeBtn svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#themeBtn .sun{display:none}
:root[data-theme="dark"] #themeBtn .sun{display:block}
:root[data-theme="dark"] #themeBtn .moon{display:none}
/* ---- category icons ---- */
.ci{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;border:1px solid var(--line);border-radius:50%;color:var(--ink)}
.ci svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cat .ci{width:24px;height:24px}.cat .ci svg{width:13px;height:13px}
.cl{display:flex;align-items:center;gap:8px;min-width:0}
</style>
</head>
<body>
<main>
<button id="themeBtn" type="button" aria-label="Switch theme">
  <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <span id="themeLbl">Dark</span>
</button>
<h1><span>CAMPUS<br>WALLET</span><i class="dot"></i></h1>

<div class="card">
  <div class="seg" id="typeSeg"><button class="on" data-t="exp">Expense</button><button data-t="inc">Income</button></div>
  <div class="row"><div><label>Amount</label><input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>
  <div><label>Date</label><input id="date" type="date"></div></div>
  <div class="row" style="margin-top:8px"><div><label>Category</label><select id="cat"></select></div>
  <div><label>Note (optional)</label><input id="note" placeholder="e.g. lunch"></div></div>
  <label style="margin-top:12px">Paid / received via</label>
  <div class="seg" id="modeSeg" style="margin:0"><button class="on" data-m="upi">UPI / Bank</button><button data-m="cash">Cash</button></div>
  <button class="btn" id="add">Add entry</button>
</div>

<div class="seg" id="viewSeg"><button class="on" data-v="day">Daily</button><button data-v="month">Monthly</button><button data-v="year">Yearly</button></div>
<div class="card" id="view"></div>

<details class="card"><summary>Settings</summary>
  <div class="row" style="margin-top:10px"><div><label>Opening UPI / bank</label><input id="open" type="number" inputmode="decimal" step="0.01"></div>
  <div><label>Currency symbol</label><input id="cur" maxlength="3"></div></div>
  <div style="margin-top:8px"><label>Opening cash in hand</label><input id="cash" type="number" inputmode="decimal" step="0.01"></div>
  <button class="btn" id="reset" style="background:var(--bad)">Clear all entries</button>
</details>
</main>

<div class="foot"><div><span style="display:flex;flex-direction:column"><span class="mute">Account balance</span><b id="bal" style="font-size:28px"></b></span><span style="display:flex;flex-direction:column;text-align:right"><span class="mute">Cash in hand</span><b id="cashbal" style="font-size:28px"></b></span></div></div>

<script>
const KEY="campus-wallet-v1";
const CATS={exp:["Food","Transport","Books & Fees","Rent","Fun","Bills","Other"],inc:["Allowance","Job","Scholarship","Other"]};
let S={open:0,cash:0,cur:"₹",tx:[]},type="exp",mode="upi",view="day";
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const money=n=>(n<0?"−":"")+S.cur+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let lastId="",prevBal={u:0,c:0},selDay=today(),selMonth=today().slice(0,7),selYear=today().slice(0,4);

function fillCats(){$("cat").innerHTML=CATS[type].map(c=>`<option>${c}</option>`).join("")}
function sums(list){let e=0,i=0,ec=0;list.forEach(t=>{if(t.type==="exp"){e+=t.amt;if(t.mode==="cash")ec+=t.amt}else i+=t.amt});return{e,i,ec}}
const ICONS={
"Food":'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1.5-3 4-3 7h3v11"/>',
"Transport":'<rect x="4" y="4" width="16" height="12" rx="2"/><path d="M4 11h16"/><circle cx="8" cy="19" r="1.5"/><circle cx="16" cy="19" r="1.5"/>',
"Books & Fees":'<path d="M4 19.5V5a2 2 0 0 1 2-2h13v14H6a2 2 0 0 0-2 2.5zM4 19.5A2 2 0 0 0 6 21h13v-4"/>',
"Rent":'<path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/>',
"Fun":'<path d="M6 8h12a4 4 0 0 1 4 4v2a3 3 0 0 1-5.2 2L15 14H9l-1.8 2A3 3 0 0 1 2 14v-2a4 4 0 0 1 4-4zM7 10.5v3M5.5 12h3M16 11.5h.01M18 13h.01"/>',
"Bills":'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',
"Other":'<path d="M6 12h.01M12 12h.01M18 12h.01" stroke-width="2.6"/>',
"Allowance":'<path d="M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14.5h.01" />',
"Job":'<path d="M3 8h18v12H3zM9 8V5h6v3M3 13h18"/>',
"Scholarship":'<path d="M2 9l10-5 10 5-10 5zM6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5M22 9v6"/>'};
const ico=c=>`<span class="ci" aria-hidden="true"><svg viewBox="0 0 24 24">${ICONS[c]||ICONS.Other}</svg></span>`;
function row(t){return `<div class="tx${t.id===lastId?" new":""}">${ico(t.cat)}<div class="m"><b>${esc(t.cat)}</b><span>${t.mode==="cash"?"CASH":"UPI"} · ${esc(t.note||"")}${t.note?" · ":""}${t.date}</span></div><div class="amt ${t.type==="exp"?"e":"i"}">${t.type==="exp"?"−":"+"}${money(t.amt).replace("−","")}</div><button class="x" data-id="${t.id}" aria-label="Delete">×</button></div>`}
function summary(s){return `<div class="sum"><div><small>Spent</small><b>${money(s.e)}</b></div><div><small>Income</small><b>${money(s.i)}</b></div><div><small>Net</small><b>${money(s.i-s.e)}</b></div></div><div class="mute" style="margin-top:8px">Spent: UPI ${money(s.e-s.ec)} · Cash ${money(s.ec)}</div>`}
function avgBox(l,days){const s=sums(l);return `<div class="sum"><div><small>Avg spent / day</small><b>${money(s.e/days)}</b></div><div><small>Avg income / day</small><b>${money(s.i/days)}</b></div></div><div class="mute" style="margin-top:6px">Average over ${days} day${days>1?"s":""}</div>`}
function ydays(){const y=+selYear,full=(y%4===0&&y%100!==0)||y%400===0?366:365;return selYear===today().slice(0,4)?Math.floor((new Date(today())-new Date(selYear+"-01-01"))/864e5)+1:full}
function dailyAvg(){const ym=selDay.slice(0,7);return avgBox(S.tx.filter(t=>t.date.startsWith(ym)&&t.date<=selDay),+selDay.slice(8))}
function breakdown(list){const m={};list.filter(t=>t.type==="exp").forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);
 const a=Object.entries(m).sort((x,y)=>y[1]-x[1]);if(!a.length)return"";const mx=a[0][1];
 return `<h3 style="margin:16px 0 0;font-size:15px">Spending by category</h3>`+a.map(([c,v],k)=>`<div class="cat"><div><span class="cl">${ico(c)}${esc(c)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%;animation-delay:${k*70}ms"></i></div></div>`).join("")}
function cols(vals,labels){const mx=Math.max(...vals,1);return `<div class="cols">`+vals.map((v,k)=>`<div title="${money(v)}"><i style="height:${v/mx*85}%;animation-delay:${k*25}ms"></i>${labels[k]}</div>`).join("")+`</div>`}

function render(){
 const all=S.tx,v=$("view");let h="";
 if(view==="day"){
  const l=all.filter(t=>t.date===selDay);
  h=`<label>Day</label><input type="date" id="pick" value="${selDay}">${summary(sums(l))}${dailyAvg()}<div style="margin-top:8px">${l.length?l.map(row).join(""):'<div class="empty">No entries for this day.</div>'}</div>`;
 }else if(view==="month"){
  const l=all.filter(t=>t.date.startsWith(selMonth)),[y,m]=selMonth.split("-").map(Number),n=new Date(y,m,0).getDate();
  const d=Array(n).fill(0);l.filter(t=>t.type==="exp").forEach(t=>d[+t.date.slice(8)-1]+=t.amt);
  h=`<label>Month</label><input type="month" id="pick" value="${selMonth}">${summary(sums(l))}${avgBox(l,selMonth===today().slice(0,7)?+today().slice(8):n)}<div class="mute" style="margin-top:12px">Daily spending</div>${cols(d,d.map((_,k)=>(k+1)%5===0||k===0?k+1:""))}${breakdown(l)}<h3 style="margin:16px 0 0;font-size:15px">Entries</h3>${l.length?l.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(row).join(""):'<div class="empty">No entries this month.</div>'}`;
 }else{
  const l=all.filter(t=>t.date.startsWith(selYear)),mo=Array(12).fill(0);
  l.filter(t=>t.type==="exp").forEach(t=>mo[+t.date.slice(5,7)-1]+=t.amt);
  const rows=mo.map((v,k)=>`<div class="tx"><div class="m"><b>${MN[k]}</b></div><div class="amt e">${money(v)}</div></div>`).join("");
  h=`<label>Year</label><input type="number" id="pick" value="${selYear}" min="2000" max="2100">${summary(sums(l))}${avgBox(l,ydays())}<div class="mute" style="margin-top:12px">Monthly spending</div>${cols(mo,MN.map(x=>x[0]))}${breakdown(l)}<h3 style="margin:16px 0 0;font-size:15px">Month by month</h3>${rows}`;
 }
 v.innerHTML=h;
 const p=$("pick");if(p)p.onchange=()=>{if(view==="day")selDay=p.value||today();else if(view==="month")selMonth=p.value||today().slice(0,7);else selYear=p.value||today().slice(0,4);render()};
 v.querySelectorAll(".x").forEach(b=>b.onclick=()=>{S.tx=S.tx.filter(t=>t.id!==b.dataset.id);save();render();bal()});
}
function tween(id,from,to){const el=$(id);el.style.color=to<0?"var(--bad)":"var(--ink)";if(from===to||matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=money(to);return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/600),e=1-Math.pow(1-p,3);el.textContent=money(from+(to-from)*e);if(p<1)requestAnimationFrame(f)})(t0)}
function bal(){let u=S.open,c=S.cash;S.tx.forEach(t=>{const d=t.type==="exp"?-t.amt:t.amt;if(t.mode==="cash")c+=d;else u+=d});tween("bal",prevBal.u,u);tween("cashbal",prevBal.c,c);prevBal={u,c}}

$("typeSeg").onclick=e=>{const t=e.target.dataset.t;if(!t)return;type=t;[...$("typeSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.t===t));fillCats()};
$("modeSeg").onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;[...$("modeSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.m===m))};
$("viewSeg").onclick=e=>{const t=e.target.dataset.v;if(!t)return;view=t;[...$("viewSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.v===t));render()};
$("add").onclick=()=>{const a=parseFloat($("amt").value);if(!(a>0)){$("amt").focus();return}
 const d=$("date").value||today();
 S.tx.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:d,type,mode,cat:$("cat").value,amt:a,note:$("note").value.trim()});
 $("amt").value="";$("note").value="";selDay=d;selMonth=d.slice(0,7);selYear=d.slice(0,4);lastId=S.tx[S.tx.length-1].id;save();render();bal()};
$("open").onchange=()=>{S.open=parseFloat($("open").value)||0;save();bal()};
$("cash").onchange=()=>{S.cash=parseFloat($("cash").value)||0;save();bal()};
$("cur").onchange=()=>{S.cur=$("cur").value||"$";save();render();bal()};
$("reset").onclick=()=>{if(confirm("Delete all entries? This can’t be undone.")){S.tx=[];save();render();bal()}};

$("date").value=today();$("open").value=S.open;$("cash").value=S.cash;$("cur").value=S.cur;
fillCats();render();bal();

/* ---- theme toggle ---- */
const THEME_KEY="campus-wallet-theme",mq=matchMedia("(prefers-color-scheme:dark)");
const curTheme=()=>document.documentElement.getAttribute("data-theme")||(mq.matches?"dark":"light");
function paintTheme(){const t=curTheme(),next=t==="dark"?"light":"dark";
  $("themeLbl").textContent=next==="dark"?"Dark":"Light";
  $("themeBtn").setAttribute("aria-label","Switch to "+next+" mode");
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="dark"?"#000000":"#e9e9e7"}
$("themeBtn").onclick=()=>{const next=curTheme()==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}
  paintTheme()};
mq.addEventListener&&mq.addEventListener("change",()=>{if(!document.documentElement.hasAttribute("data-theme"))paintTheme()});
paintTheme();
</script>
<script>try{if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js")}catch(e){}</script>
